name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  release:

  schedule:
    - cron: "48 3 * * *"

  workflow_dispatch:
  
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
            python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          cmake \
          ninja-build \
          build-essential \
          pkg-config

      - name: Install Conan 2
        run: pip install --require-hashes -r buildfiles/conan/requirements.txt

      - name: Setup
        run: make setup
      - name: Configure
        run: make init
      - name: Build 
        run: make

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Integration tests
        run: make docker-integration-tests
