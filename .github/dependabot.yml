# Keeps the hash/digest-pinned dependencies in this repository up to date.
# Minor and patch updates are grouped per ecosystem; major updates are raised
# as individual PRs so one breaking upgrade does not block the rest.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/buildfiles/conan"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/buildfiles/conan"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/tests/performance_tester"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/tests/acceptance/integration"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
